[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebellum"
version = "0.2.0"
description = "Cerebellum: ablation-informed mixed-precision GGUF quantization"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cerebellum = "cerebellum.cli:main"
# Deprecated alias kept for old scripts; remove after the shim window closes.
osmosis = "cerebellum._legacy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
# "osmosis*" ships the deprecation shim package only.
include = ["cerebellum*", "osmosis*"]
